<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0967f9" />
    <meta name="description" content="Il Tuo Lavoro — gestionale artigiano per interventi, clienti, cantieri e scadenze." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      /* Fallback immediato: visibile anche mentre il modulo JS viene scaricato. */
      .boot-screen{min-height:100svh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#071b61,#2867f6 58%,#9d54ff);color:#fff;font:600 16px system-ui,-apple-system,sans-serif;text-align:center}
      .boot-card{width:min(100%,360px);padding:32px 24px;border:1px solid #ffffff55;border-radius:28px;background:#ffffff18;box-shadow:0 18px 50px #00134a55;backdrop-filter:blur(12px)}
      .boot-mark{font-size:44px;line-height:1.2;margin-bottom:12px}.boot-subtitle{font-size:13px;font-weight:400;opacity:.85;margin-top:8px}
      .boot-spinner{width:24px;height:24px;margin:22px auto 0;border:3px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:boot-spin .8s linear infinite}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
      @media(prefers-reduced-motion:reduce){.boot-spinner{animation:none}}
    </style>
    <title>Il Tuo Lavoro · Gestionale Artigiano</title>
  </head>
  <body>
    <div id="root" aria-live="off">
      <div class="boot-screen" role="status" aria-label="Caricamento applicazione">
        <div class="boot-card"><div class="boot-mark" aria-hidden="true">⌂</div><div>Il Tuo Lavoro</div><div class="boot-subtitle">Preparazione del gestionale…</div><div class="boot-spinner" aria-hidden="true"></div></div>
      </div>
    </div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
